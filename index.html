<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#091426">
<meta name="application-name" content="Smart Mirror Receiver">
<meta name="apple-mobile-web-app-title" content="Smart Mirror Receiver">
<title>Smart Mirror Receiver</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%231d3b68'/%3E%3Crect x='24' y='27' width='60' height='45' rx='7' fill='none' stroke='%23ffffff' stroke-width='5'/%3E%3Ccircle cx='54' cy='49.5' r='14' fill='none' stroke='%235b8cff' stroke-width='5'/%3E%3Ccircle cx='54' cy='49.5' r='5' fill='%23ffffff'/%3E%3Cpath d='M54 72v11M41 83h26' fill='none' stroke='%23ffffff' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#101f35;--line:#263b59;--blue:#5b8cff;--muted:#a9b8ce}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#142b4c,var(--bg) 65%);font:16px system-ui;color:#f4f7fc;display:grid;place-items:center;padding:22px}
main{width:min(100%,460px);background:#0e1b2e;border:1px solid var(--line);border-radius:26px;padding:28px;box-shadow:0 20px 70px #0008}
.logo{width:54px;height:54px;border-radius:17px;background:#1d3b68;display:grid;place-items:center;margin-bottom:18px}
.logo svg{width:42px;height:42px}
h1{margin:0;font-size:29px}
p{color:var(--muted);line-height:1.5}
.tabs{display:flex;gap:8px;margin:24px 0 18px}
.tab{flex:1;border:1px solid var(--line);background:#12233a;color:#c9d6e8;padding:12px;border-radius:13px;font-weight:650}
.tab.active{background:#244b87;border-color:#5b8cff;color:white}
label{display:block;margin:14px 0 8px;color:#d9e4f4;font-size:14px}
input{width:100%;padding:16px;border-radius:14px;border:1px solid #355071;background:#081426;color:white;font-size:20px;outline:none}
input:focus{border-color:var(--blue)}
button.primary{width:100%;margin-top:16px;padding:16px;border:0;border-radius:14px;background:var(--blue);color:white;font-size:16px;font-weight:750}
small{display:block;color:var(--muted);line-height:1.5;margin-top:16px}
.status{min-height:24px;margin-top:12px;color:#ffd479;font-size:14px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 108 108" role="img" aria-label="Smart Mirror">
      <rect x="24" y="27" width="60" height="45" rx="7" fill="none" stroke="#fff" stroke-width="5"/>
      <circle cx="54" cy="49.5" r="14" fill="none" stroke="#5b8cff" stroke-width="5"/>
      <circle cx="54" cy="49.5" r="5" fill="#fff"/>
      <path d="M54 72v11M41 83h26" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </svg>
  </div>
  <h1>Smart Mirror</h1>
  <p>Conecte este dispositivo à tela compartilhada pelo celular.</p>
  <div class="tabs">
    <button class="tab active" id="codeTab" type="button">Código</button>
    <button class="tab" id="ipTab" type="button">Endereço IP</button>
  </div>
  <section id="codePanel">
    <label for="code">Código de 4 dígitos</label>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="0000">
    <button class="primary" id="connectCode" type="button">Conectar por código</button>
  </section>
  <section id="ipPanel" class="hidden">
    <label for="ip">Endereço IP do celular</label>
    <input id="ip" inputmode="url" placeholder="192.168.1.20:8080">
    <button class="primary" id="connectIp" type="button">Conectar por IP</button>
  </section>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <small>Para conexão por IP, os dispositivos precisam estar na mesma rede Wi-Fi ou hotspot. A transmissão de vídeo é feita diretamente pela rede local.</small>
</main>
<script>
/* Serviço de pareamento do Smart Mirror */
const API_BASE = "https://smartmirror-pairing.dihenriqueoliveira2024.workers.dev";
const $ = id => document.getElementById(id);

function switchTab(which){
  const code = which === "code";
  $("codePanel").classList.toggle("hidden",!code);
  $("ipPanel").classList.toggle("hidden",code);
  $("codeTab").classList.toggle("active",code);
  $("ipTab").classList.toggle("active",!code);
  $("status").textContent="";
}
$("codeTab").onclick=()=>switchTab("code");
$("ipTab").onclick=()=>switchTab("ip");

function openReceiver(address){
  let value=String(address || "").trim();
  if(!value){$("status").textContent="O serviço não retornou um endereço válido.";return;}
  if(!/^https?:\/\//i.test(value)) value="http://"+value;
  if(!/:\d+(\/|$)/.test(value.replace(/^https?:\/\//i,""))) value=value.replace(/\/?$/,"")+":8080";
  if(!/^https?:\/\/[\w.-]+:\d{1,5}(\/.*)?$/i.test(value)){
    $("status").textContent="Endereço inválido. Confira o IP e a porta.";return;
  }
  location.href=value;
}

$("connectIp").onclick=()=>openReceiver($("ip").value);
$("ip").addEventListener("keydown",e=>{if(e.key==="Enter")$("connectIp").click()});
$("code").addEventListener("input",()=>{$("code").value=$("code").value.replace(/\D/g,"").slice(0,4)});
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")$("connectCode").click()});

$("connectCode").onclick=async()=>{
  const code=$("code").value;
  if(!/^\d{4}$/.test(code)){
    $("status").textContent="Digite os 4 números do código.";return;
  }
  const button=$("connectCode");
  button.disabled=true;
  $("status").textContent="Procurando o celular…";
  try{
    const response=await fetch(API_BASE.replace(/\/$/,"")+"/lookup?code="+encodeURIComponent(code),{
      method:"GET",
      headers:{"Accept":"application/json"}
    });
    let data={};
    try{data=await response.json();}catch(_){}
    if(!response.ok) throw new Error(data.error||"Código não encontrado ou expirado.");
    if(!data.url) throw new Error("O Worker não retornou o endereço do celular.");
    $("status").textContent="Celular encontrado. Abrindo conexão…";
    openReceiver(data.url);
  }catch(error){
    $("status").textContent=error.message||"Não foi possível localizar o celular.";
  }finally{
    button.disabled=false;
  }
};
</script>
</body>
</html>
